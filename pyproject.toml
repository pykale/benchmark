[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalebenchmark"
version = "0.1.0a2"
description = "A thin benchmark wrapper that composes existing PyKale components."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["benchmark", "machine learning", "pykale", "materials", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pykale"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/pykale/pykale"

[tool.setuptools.packages.find]
include = ["kalebenchmark*"]

[tool.black]
# https://github.com/psf/black
line-length = 120
target-version = ["py311"]

[tool.isort]
known_first_party = [
    "docs",
    "examples",
    "kale",
    "kalebenchmark",
    "tests",
]
profile = "black"
line_length = 120
force_sort_within_sections = "False"
order_by_type = "False"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the RealMat-BaG checkout with extracted CIF files"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
